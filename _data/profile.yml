about_lead: >-
  I'm the Business Product Owner for the SSE Airtricity app, used by Home Energy customers across the Republic of
  Ireland and Northern Ireland. I own the roadmap and backlog, and I led its move to a new React platform alongside a
  full UX redesign.
about_more: >-
  My background is in digital change across telecoms, banking and energy. That taught me how to turn business strategy
  into a prioritised backlog, work hand in hand with UX and engineering, and bring operations teams along when things
  change. I also lead Enhanced Smart Insights, an award-winning programme that puts personalised, data-driven advice in
  front of customers.
